name: Temporary repository convergence

on:
  push:
    branches:
      - automation/converge-backend-contract

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: e063bec7332c092d2c29a830a2131778a0122198
          path: target

      - name: Checkout coding-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: moritzbrantner/coding-tooling
          ref: 190f06c17606b14919da8389867798f2ed9b9dc5
          path: coding-tooling

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install coding-tooling
        working-directory: coding-tooling
        run: bun install --frozen-lockfile

      - name: Converge exact candidate
        working-directory: target
        shell: bash
        run: |
          set +e
          bun ../coding-tooling/src/entry.ts converge --verify-tier e2e --json > ../convergence.json 2> ../convergence.stderr
          code=$?
          set -e

          echo "convergence exit code: $code"
          cat ../convergence.json
          cat ../convergence.stderr >&2

          echo "--- worktree status ---"
          git status --short
          echo "--- diff stat ---"
          git diff --stat
          echo "--- changed paths ---"
          git diff --name-only
          echo "--- diff ---"
          git diff

          exit "$code"
