name: Temporary repository convergence

on:
  push:
    branches:
      - automation/converge-typescript-deterministic

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact TypeScript candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/asset-tooling
          ref: 9889b6af8ec19687b5d90c9259f84c1b0cbcd784
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out coding-tooling authority
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: main
          path: coding-tooling
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install coding-tooling exactly
        working-directory: coding-tooling
        run: bun install --frozen-lockfile

      - name: Run repository convergence against candidate
        id: convergence
        working-directory: target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ../convergence-evidence
          bun ../coding-tooling/src/entry.ts converge --verify-tier e2e --json > ../convergence-evidence/result.json 2> ../convergence-evidence/stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > ../convergence-evidence/exit-code.txt
          git status --short > ../convergence-evidence/status.txt
          git diff --stat > ../convergence-evidence/diff-stat.txt
          git diff --name-status > ../convergence-evidence/diff-names.txt
          git diff --binary > ../convergence-evidence/convergence.patch
          echo "exit_code=$status"
          echo "--- convergence result ---"
          cat ../convergence-evidence/result.json
          echo "--- convergence stderr ---"
          cat ../convergence-evidence/stderr.txt
          echo "--- worktree status ---"
          cat ../convergence-evidence/status.txt
          echo "--- diff stat ---"
          cat ../convergence-evidence/diff-stat.txt
          exit "$status"

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-convergence-${{ github.run_id }}
          path: convergence-evidence/
          if-no-files-found: error
          retention-days: 1
