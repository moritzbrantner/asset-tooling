name: Verify Maps Shortbread release

on:
  pull_request:
    paths:
      - .github/workflows/verify-maps-shortbread-release.yml
      - .github/workflows/publish-releases.yml
      - scripts/build-maps-shortbread-release.ts
      - scripts/publish-release.ts
      - examples/maps-shortbread/**
      - src/maps-shortbread.ts
      - src/asset-bundle-pack.ts
      - test/maps-shortbread-release.test.ts
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-verify:
    name: Build and inspect pinned-source Liechtenstein archives
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - run: bun install --frozen-lockfile
      - name: Validate the promotion rules and prior fixture contract
        run: bun test test/maps-shortbread-release.test.ts test/maps-shortbread.test.ts test/publish-release.test.ts
      - name: Acquire reviewed source and tool inputs
        run: bun examples/maps-shortbread/build.ts acquire
      - name: Generate archives and independently inspect every tile
        run: bun scripts/publish-release.ts build maps-shortbread "$RUNNER_TEMP/maps-release"
      - name: Verify the publication handoff without uploading
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-release.ts publish maps-shortbread "$RUNNER_TEMP/maps-release" --dry-run
