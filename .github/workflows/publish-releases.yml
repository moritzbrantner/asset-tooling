name: Publish rolling releases

# Rebuilds every rolling release whose sources a push to main changed and replaces its assets in place
# (Atlas Decision 7.1.5, README "Publishing a rolling release", #397). A manual dispatch rebuilds one release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Rolling release to rebuild and publish (the name of a releases/<name>.json)
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan changed releases
    # Only main is published; a dispatch from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - id: plan
        env:
          RELEASE: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            matrix=$(bun scripts/publish-release.ts plan --release "$RELEASE")
          else
            # A new branch or a force push without a known parent rebuilds everything.
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo '*' > "$RUNNER_TEMP/changed"
            else
              git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
            fi
            matrix=$(bun scripts/publish-release.ts plan --changed "$RUNNER_TEMP/changed")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Releases to rebuild: $matrix"

  publish:
    name: ${{ matrix.release }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Per release (PlanEntry.timeout): 60 minutes, more for the Ranger figures.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: write
      actions: write
      issues: write
    # One publish per release at a time; a newer push supersedes a queued one.
    concurrency:
      group: publish-release-${{ matrix.release }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OUT: release-out
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - uses: ./.github/actions/build-release
        with:
          release: ${{ matrix.release }}
          blender: ${{ matrix.blender }}
          lfs: ${{ matrix.lfs }}
          processor: ${{ matrix.processor }}
          ktx: ${{ matrix.ktx }}
          java: ${{ matrix.java }}
          save-cache: true
      # #691: nothing is published that the game could not decode. The changed entries load through three's
      # GLTFLoader with the meshopt and KTX2 decoders and through mmorpg's native glTF path.
      - name: Load the changed entries through the game's loaders
        env:
          RELEASE: ${{ matrix.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chromium
          bun scripts/check-game-loaders.ts "$OUT" --live "$RELEASE"
      - name: Check consumers and publish
        env:
          RELEASE: ${{ matrix.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bun scripts/publish-release.ts publish "$RELEASE" "$OUT" 2>&1 | tee "$RUNNER_TEMP/publish.log"
      - name: Rebuild Pages from the replaced release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q ': published tar ' "$RUNNER_TEMP/publish.log"; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
      # When a pinned consumer blocks the publish, the exact build is kept for scripts/prepare-release.ts.
      - name: Keep the refused build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.release }}
          path: |
            release-out/*.tar
            release-out/*.sha256
            release-out/*.json
            release-out/*.png
          if-no-files-found: ignore
          retention-days: 7
      # #732: a failed publish opens (or comments on) one issue per release, closed again when the release publishes.
      - name: Report the publish on its release issue
        if: ${{ !cancelled() }}
        env:
          RELEASE: ${{ matrix.release }}
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Release $RELEASE failed to publish"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ "$STATUS" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Published from $GITHUB_SHA in $run_url."
            fi
            exit 0
          fi
          refusal=$(grep -E "^$RELEASE: refusing to publish" "$RUNNER_TEMP/publish.log" 2>/dev/null || true)
          {
            echo "The \`$RELEASE\` job of Publish rolling releases failed at $GITHUB_SHA: $run_url"
            echo
            if [[ -n "$refusal" ]]; then
              echo '```'
              echo "$refusal"
              echo '```'
            else
              echo "It failed before refusing the tar; see the run log."
            fi
          } > "$RUNNER_TEMP/issue.md"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
