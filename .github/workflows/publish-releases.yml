name: Publish rolling releases

# Rebuilds every rolling release whose sources a push to main changed and replaces its assets in place
# (Atlas Decision 7.1.5, README "Publishing a rolling release", #397). A manual dispatch rebuilds one release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Rolling release to rebuild and publish (the name of a releases/<name>.json)
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan changed releases
    # Only main is published; a dispatch from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - id: plan
        env:
          RELEASE: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            matrix=$(bun scripts/publish-release.ts plan --release "$RELEASE")
          else
            # A new branch or a force push without a known parent rebuilds everything.
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo '*' > "$RUNNER_TEMP/changed"
            else
              git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
            fi
            matrix=$(bun scripts/publish-release.ts plan --changed "$RUNNER_TEMP/changed")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Releases to rebuild: $matrix"

  publish:
    name: ${{ matrix.release }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Per release (PlanEntry.timeout): 60 minutes, more for the Ranger figures.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: write
      actions: write
    # One publish per release at a time; a newer push supersedes a queued one.
    concurrency:
      group: publish-release-${{ matrix.release }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OUT: release-out
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      # The Ranger's object store holds every intermediate GLB (well over 10 GB); drop preinstalled SDKs it never uses.
      - name: Free disk space
        if: matrix.processor != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
      - name: Hydrate the canonical payloads
        if: matrix.lfs
        run: git lfs pull --include="assets/canonical/**"
      # The hand-authored Blender sources are small; every build that names one reads it hydrated.
      - name: Hydrate the authored sources
        run: git lfs pull --include="assets/authored/**"
      - id: processor
        name: Read the processor pin
        if: matrix.processor != ''
        env:
          PROCESSOR: ${{ matrix.processor }}
        run: |
          set -euo pipefail
          pin=$(jq -ce --arg id "$PROCESSOR" '.processors[] | select(.id == $id)' stability/processors.json)
          echo "repository=$(jq -r .repository <<<"$pin")" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit <<<"$pin")" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -r .manifestPath <<<"$pin")" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned processor
        if: matrix.processor != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ steps.processor.outputs.repository }}
          ref: ${{ steps.processor.outputs.commit }}
          path: processor
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: matrix.processor != ''
        with:
          toolchain: stable
      # The processor is an exact checkout; persist its compiled workspace between releases,
      # but keep `cargo run --offline` as the authority for checking/rebuilding the binary.
      - id: rustc-identity
        name: Identify the Rust compiler for cache isolation
        if: matrix.processor != ''
        run: |
          set -euo pipefail
          echo "sha=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Resolve the processor dependency lock
        if: matrix.processor != ''
        env:
          MANIFEST: ${{ steps.processor.outputs.manifest }}
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "processor/$MANIFEST"
      - name: Reuse the pinned processor's Cargo dependencies and compiled target
        if: matrix.processor != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            processor/target
          key: processor-${{ runner.os }}-${{ runner.arch }}-${{ steps.processor.outputs.commit }}-${{ steps.rustc-identity.outputs.sha }}-${{ hashFiles('processor/Cargo.lock') }}
      - name: Fetch the processor's dependencies
        if: matrix.processor != ''
        env:
          MANIFEST: ${{ steps.processor.outputs.manifest }}
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path "processor/$MANIFEST"
          echo "ASSET_TOOLING_PROCESSOR_CHECKOUT_3DLAB=$GITHUB_WORKSPACE/processor" >> "$GITHUB_ENV"
      - name: Install KTX-Software
        if: matrix.ktx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo KhronosGroup/KTX-Software --pattern 'KTX-Software-*-Linux-x86_64.deb' --dir "$RUNNER_TEMP/ktx"
          sudo apt-get install -y "$RUNNER_TEMP"/ktx/*.deb
          ktx --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # setup-bun caches the executable, not the content-addressed packages consumed by `bun install`.
      - name: Reuse Bun's downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.java != ''
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Only the trusted GitHub CLI sees this write-capable job token. The
      # subsequent installer never executes publisher binaries with it present.
      - name: Resolve latest FFmpeg release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/FFmpeg-Builds/FFmpeg-Builds/releases/tags/latest > "$RUNNER_TEMP/ffmpeg-release.json"
      - name: Install latest stable FFmpeg
        run: |
          set -euo pipefail
          CODEC_BIN="$(bun scripts/install-ffmpeg.ts --release-metadata "$RUNNER_TEMP/ffmpeg-release.json")"
          echo "$CODEC_BIN" >> "$GITHUB_PATH"
      - name: Report installed FFmpeg versions
        run: |
          set -euo pipefail
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Acquire the pinned Maps regional source and upstream tools
        if: matrix.release == 'maps-shortbread'
        run: bun examples/maps-shortbread/build.ts acquire
      # scripts/install-blender.ts reuses a verified archive at /tmp/asset-tooling-blender-<sha256>.archive.
      - name: Cache the Blender archive
        if: matrix.blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/asset-tooling-blender-*.archive
          key: blender-${{ hashFiles('adapters/blender/release.json') }}
      - name: Install pinned Blender
        if: matrix.blender
        run: echo "ASSET_TOOLING_BLENDER=$(bun scripts/install-blender.ts "$RUNNER_TEMP/blender")" >> "$GITHUB_ENV"
      # #516, docs/cache.md#shared-cache-directory: every Blender release keeps its generation cache (the Blender
      # step outputs) between runs, so a merge that leaves the Blender backend, the recipes and their inputs alone
      # reuses every Blender step. The key prefix names the release, the Blender pin and the backend's scoped
      # cache-source fingerprint; the newest cache with that prefix is restored, and entries whose recipe or input
      # changed simply miss.
      - id: generation-cache-key
        name: Key the shared generation cache
        if: matrix.blender
        env:
          RELEASE: ${{ matrix.release }}
          BLENDER_PIN: ${{ hashFiles('adapters/blender/release.json') }}
        run: |
          set -euo pipefail
          echo "prefix=generation-v1-$RELEASE-$BLENDER_PIN-$(bun scripts/generation-cache.ts key)-" >> "$GITHUB_OUTPUT"
      - id: generation-cache-restore
        name: Restore the shared generation cache
        if: matrix.blender
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asset-tooling/cache
          key: ${{ steps.generation-cache-key.outputs.prefix }}
          restore-keys: ${{ steps.generation-cache-key.outputs.prefix }}
      - id: build
        name: Build
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          date +%s%3N > "$RUNNER_TEMP/build-started"
          ASSET_TOOLING_GENERATION_CACHE_DIR="$GITHUB_WORKSPACE/.asset-tooling/cache" bun scripts/publish-release.ts build "$RELEASE" "$OUT"
      # Keep only the entries this build read or wrote; a cache whose entries did not change is not saved again.
      - id: generation-cache-prune
        name: Prune the shared generation cache
        if: matrix.blender
        env:
          PREFIX: ${{ steps.generation-cache-key.outputs.prefix }}
        run: |
          set -euo pipefail
          bun scripts/generation-cache.ts prune "$GITHUB_WORKSPACE/.asset-tooling/cache" --since "$(cat "$RUNNER_TEMP/build-started")"
          du -sh .asset-tooling/cache
          entries=$( (find .asset-tooling/cache/v1/builds .asset-tooling/cache/v1/operations -name '*.json' -printf '%P\n' 2>/dev/null || true) | sort | sha256sum | cut -c1-16)
          echo "key=$PREFIX$entries" >> "$GITHUB_OUTPUT"
      - name: Save the shared generation cache
        if: matrix.blender && steps.generation-cache-prune.outputs.key != steps.generation-cache-restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .asset-tooling/cache
          key: ${{ steps.generation-cache-prune.outputs.key }}
      - name: Check consumers and publish
        env:
          RELEASE: ${{ matrix.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bun scripts/publish-release.ts publish "$RELEASE" "$OUT" | tee "$RUNNER_TEMP/publish.log"
      - name: Rebuild Pages from the replaced release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q ': published tar ' "$RUNNER_TEMP/publish.log"; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
      # When a pinned consumer blocks the publish, the exact build is kept for scripts/prepare-release.ts.
      - name: Keep the refused build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.release }}
          path: |
            release-out/*.tar
            release-out/*.sha256
            release-out/*.json
            release-out/*.png
          if-no-files-found: ignore
          retention-days: 7
