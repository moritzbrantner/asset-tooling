name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  processing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install --requirement requirements-validation.txt
      - run: python scripts/test-processing-contract.py
      - run: python scripts/validate-reproducibility.py examples/mesh-simplify-receipt.json examples/mesh-lod-chain-receipt.json
      - run: python scripts/validate-processing-observations.py examples/mesh-simplify-receipt.json examples/mesh-lod-chain-receipt.json
