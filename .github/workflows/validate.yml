name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      extended: ${{ steps.detect.outputs.extended }}
      pages: ${{ steps.detect.outputs.pages }}
      stability: ${{ steps.detect.outputs.stability }}
      allow-skipped: ${{ steps.detect.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: bash scripts/ci-impact.sh

  validate:
    needs: impact
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && needs.impact.outputs.extended == 'false' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Test and validate example contract
        run: bun run check

  selected-bundle-consumer:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install declared image codec
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - name: Accept actual packed selected-bundle consumer
        run: bun run verify:consumer:bundle

  blender-script:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.extended == 'true'
    name: blender-script (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 15 }}
    # Every test under test/blender/<suite> runs here: a new Blender test is picked up by where it lives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: kits
            lfs: "assets/canonical/quaternius.stylized-nature-megakit-standard.*/**,assets/canonical/poly-haven.fir-tree-01-*/**,assets/canonical/poly-haven.rock-boulder-dry-*/**,assets/canonical/poly-haven.mossy-rock-*/**,assets/canonical/quaternius.animal-pack-vol2.cat-blend/**,assets/canonical/quaternius.ultimate-animated-animals-shibainu-glb/**,assets/canonical/quaternius.easy-enemy-rat-glb/**"
          - suite: recipes
            lfs: "assets/canonical/quaternius.universal-base-characters-standard.*/**,assets/canonical/quaternius.modular-character-outfits-fantasy-standard.*/**"
          # The fortress kit's 51 recipe runs (17 pieces x 3 levels) take longer than the other kits together.
          - suite: fortress
            timeout: 60
            lfs: "assets/canonical/poly-haven.broken-wall-*/**,assets/canonical/poly-haven.japanese-stone-wall-*/**,assets/canonical/poly-haven.stone-tiles-02-*/**,assets/canonical/poly-haven.old-planks-02-*/**"
          # The climbing kit's 45 recipe runs (15 parts x 3 levels).
          - suite: climbing
            timeout: 30
            lfs: "assets/canonical/quaternius.medieval-village-megakit-standard.t-vineleaf-png-png/**"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Cache the Blender archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/asset-tooling-blender-*.archive
          key: blender-${{ hashFiles('adapters/blender/release.json') }}
      - name: Install pinned Blender
        run: echo "ASSET_TOOLING_BLENDER=$(bun scripts/install-blender.ts "$RUNNER_TEMP/blender")" >> "$GITHUB_ENV"
      - name: Install image inspection codec
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire pinned Sapling test input
        run: |
          set -euo pipefail
          SAPLING_SOURCE_URL=$(bun -e 'import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; console.log(SAPLING_TREE_SOURCE.download)')
          curl --fail --location --max-time 30 --max-filesize 36296 "$SAPLING_SOURCE_URL" --output "$RUNNER_TEMP/sapling.zip"
          bun -e 'import { readFile } from "node:fs/promises"; import { sha256Bytes } from "./src/hash.ts"; import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; const bytes = await readFile(process.argv[1]); if (bytes.length !== SAPLING_TREE_SOURCE.byteLength || sha256Bytes(bytes) !== SAPLING_TREE_SOURCE.sha256) throw new Error("Sapling input pin mismatch")' "$RUNNER_TEMP/sapling.zip"
          echo "ASSET_TOOLING_SAPLING_ARCHIVE=$RUNNER_TEMP/sapling.zip" >> "$GITHUB_ENV"
      - name: Hydrate the suite's canonical sources
        run: git lfs pull --include="${{ matrix.lfs }}"
      - name: Blender script backend round trips
        env:
          BLENDER_TESTS: "1"
        run: |
          bun install --frozen-lockfile
          bun test test/blender/${{ matrix.suite }}

  canonical-storage:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify Git LFS object integrity
        run: |
          git lfs install --local
          git lfs fsck
      - name: Verify hydrated canonical asset bytes
        run: bun run catalog:storage:verify
      - name: Install declared image codec
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify Greyhaven starter source members
        env:
          ASSET_TOOLING_REQUIRE_HYDRATED_STORAGE: "1"
        # Every test under test/hydrated runs here.
        run: bun test test/hydrated

  processing-contract:
    needs: impact
    if: github.event_name != 'pull_request' || needs.impact.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install --requirement requirements-validation.txt
      - run: python scripts/test-model-acquisition.py
      - run: python scripts/test-model-acquisition-file.py
      - run: python scripts/test-setup-tools.py
      - run: python scripts/test-processing-contract.py
      - run: >-
          python scripts/validate-reproducibility.py
          examples/mesh-simplify-receipt.json
          examples/mesh-lod-chain-receipt.json
          examples/animation-resample-receipt.json
          examples/animation-reduce-receipt.json
      - run: >-
          python scripts/validate-processing-observations.py
          examples/mesh-simplify-receipt.json
          examples/mesh-lod-chain-receipt.json
          examples/animation-resample-receipt.json
          examples/animation-reduce-receipt.json

  stability-validation:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.stability == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/stability.yml

  pages-validation:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.pages == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["impact", "validate", "selected-bundle-consumer", "blender-script", "canonical-storage", "processing-contract", "stability-validation", "pages-validation"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["impact", "validate", "selected-bundle-consumer", "blender-script", "canonical-storage", "processing-contract", "stability-validation", "pages-validation"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["pages-validation", "stability-validation"]' || needs.impact.outputs.allow-skipped || '[]' }}
