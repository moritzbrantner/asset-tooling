name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The safety net for the scoped pull request and push plans (#574): every job, nightly and on demand.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A push plans only its own diff, so a newer push must not cancel it; only a pull request's older runs are superseded.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Classify PR changes
    runs-on: ubuntu-latest
    # scripts/ci-plan.ts: a pull request or a push to main runs only the jobs whose sources it changed; the nightly
    # schedule and a manual dispatch run everything.
    outputs:
      os: ${{ steps.detect.outputs.os }}
      blender: ${{ steps.detect.outputs.blender }}
      blender-enabled: ${{ steps.detect.outputs.blender-enabled }}
      selected-bundle-consumer: ${{ steps.detect.outputs.selected-bundle-consumer }}
      canonical-storage: ${{ steps.detect.outputs.canonical-storage }}
      processing-contract: ${{ steps.detect.outputs.processing-contract }}
      pages: ${{ steps.detect.outputs.pages }}
      stability: ${{ steps.detect.outputs.stability }}
      allow-skipped: ${{ steps.detect.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A push diffs against the commit before it.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: bash scripts/ci-impact.sh

  validate:
    needs: impact
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.impact.outputs.os) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Test and validate example contract
        run: bun run check

  selected-bundle-consumer:
    needs: impact
    if: needs.impact.outputs.selected-bundle-consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install latest stable FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEC_BIN="$(bun scripts/install-ffmpeg.ts)"
          echo "$CODEC_BIN" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Accept actual packed selected-bundle consumer
        run: bun run verify:consumer:bundle

  blender-script:
    needs: impact
    if: needs.impact.outputs.blender-enabled == 'true'
    name: blender-script (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    # Each suite's test/blender/<suite>/suite.json names its LFS payloads, timeout and KTX need (scripts/ci-plan.ts).
    # A pull request or push runs the tests whose sources it changed; the schedule and a dispatch run every suite.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.blender) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Cache the Blender archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/asset-tooling-blender-*.archive
          key: blender-${{ hashFiles('adapters/blender/release.json') }}
      - name: Install pinned Blender
        run: echo "ASSET_TOOLING_BLENDER=$(bun scripts/install-blender.ts "$RUNNER_TEMP/blender")" >> "$GITHUB_ENV"
      - name: Install latest stable FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEC_BIN="$(bun scripts/install-ffmpeg.ts)"
          echo "$CODEC_BIN" >> "$GITHUB_PATH"
      - name: Acquire pinned Sapling test input
        run: |
          set -euo pipefail
          SAPLING_SOURCE_URL=$(bun -e 'import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; console.log(SAPLING_TREE_SOURCE.download)')
          curl --fail --location --max-time 30 --max-filesize 36296 "$SAPLING_SOURCE_URL" --output "$RUNNER_TEMP/sapling.zip"
          bun -e 'import { readFile } from "node:fs/promises"; import { sha256Bytes } from "./src/hash.ts"; import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; const bytes = await readFile(process.argv[1]); if (bytes.length !== SAPLING_TREE_SOURCE.byteLength || sha256Bytes(bytes) !== SAPLING_TREE_SOURCE.sha256) throw new Error("Sapling input pin mismatch")' "$RUNNER_TEMP/sapling.zip"
          echo "ASSET_TOOLING_SAPLING_ARCHIVE=$RUNNER_TEMP/sapling.zip" >> "$GITHUB_ENV"
      - name: Install KTX-Software
        if: matrix.ktx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo KhronosGroup/KTX-Software --pattern 'KTX-Software-*-Linux-x86_64.deb' --dir "$RUNNER_TEMP/ktx"
          sudo apt-get install -y "$RUNNER_TEMP"/ktx/*.deb
          ktx --version
      - name: Hydrate the suite's canonical sources
        run: git lfs pull --include="${{ matrix.lfs }}"
      - name: Blender script backend round trips
        env:
          BLENDER_TESTS: "1"
        run: |
          bun install --frozen-lockfile
          bun test ${{ matrix.tests }}

  canonical-storage:
    needs: impact
    if: needs.impact.outputs.canonical-storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify Git LFS object integrity
        run: |
          git lfs install --local
          git lfs fsck
      - name: Verify hydrated canonical asset bytes
        run: bun run catalog:storage:verify
      - name: Install latest stable FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEC_BIN="$(bun scripts/install-ffmpeg.ts)"
          echo "$CODEC_BIN" >> "$GITHUB_PATH"
      - name: Verify Greyhaven starter source members
        env:
          ASSET_TOOLING_REQUIRE_HYDRATED_STORAGE: "1"
        # Every test under test/hydrated runs here.
        run: bun test test/hydrated

  processing-contract:
    needs: impact
    if: needs.impact.outputs.processing-contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install --requirement requirements-validation.txt
      - run: python scripts/test-model-acquisition.py
      - run: python scripts/test-model-acquisition-file.py
      - run: python scripts/test-setup-tools.py
      - run: python scripts/test-processing-contract.py
      - run: >-
          python scripts/validate-reproducibility.py
          examples/mesh-simplify-receipt.json
          examples/mesh-lod-chain-receipt.json
          examples/animation-resample-receipt.json
          examples/animation-reduce-receipt.json
      - run: >-
          python scripts/validate-processing-observations.py
          examples/mesh-simplify-receipt.json
          examples/mesh-lod-chain-receipt.json
          examples/animation-resample-receipt.json
          examples/animation-reduce-receipt.json

  stability-validation:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.stability == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/stability.yml

  pages-validation:
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.pages == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["impact", "validate", "selected-bundle-consumer", "blender-script", "canonical-storage", "processing-contract", "stability-validation", "pages-validation"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["impact", "validate", "selected-bundle-consumer", "blender-script", "canonical-storage", "processing-contract", "stability-validation", "pages-validation"]'
          # Outside a pull request the plan (ci-plan.ts --branch) always lists Pages and Stability as skipped.
          allow-skipped: ${{ needs.impact.outputs.allow-skipped || '[]' }}
