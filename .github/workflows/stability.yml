name: Stability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Run local stability gate
        run: bun run stability:check

  consumer-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - id: matrix
        name: Load accepted consumers
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const manifest=JSON.parse(fs.readFileSync("stability/consumers.json","utf8")); process.stdout.write("matrix="+JSON.stringify({include:manifest.consumers})+"\n")' >> "$GITHUB_OUTPUT"

  consumer-contract:
    needs: consumer-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.consumer-matrix.outputs.matrix) }}
    steps:
      - name: Checkout current asset-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: asset-tooling
      - name: Checkout accepted consumer
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: consumer
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Validate current head against accepted consumer
        shell: bash
        run: |
          spec="consumer/${{ matrix.specPath }}"
          tool="asset-tooling/src/entry.js"
          bun "$tool" validate "$spec"
          bun "$tool" generate "$spec" --receipt .asset-tooling/stability.receipt.json
          bun "$tool" verify "$spec" --receipt .asset-tooling/stability.receipt.json

  processor-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - id: matrix
        name: Load accepted processors
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const manifest=JSON.parse(fs.readFileSync("stability/processors.json","utf8")); process.stdout.write("matrix="+JSON.stringify({include:manifest.processors})+"\n")' >> "$GITHUB_OUTPUT"

  processor-contract:
    needs: processor-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.processor-matrix.outputs.matrix) }}
    steps:
      - name: Checkout current asset-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: asset-tooling
      - name: Checkout accepted processor
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: processor
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Validate current head against accepted processor
        shell: bash
        run: |
          bun asset-tooling/scripts/check-processor-contract.js \
            "$GITHUB_WORKSPACE/processor" \
            "${{ matrix.commit }}" \
            "${{ matrix.repository }}" \
            "${{ matrix.manifestPath }}" \
            "${{ matrix.operation }}"

  workflow-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current asset-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: asset-tooling
      - id: stack
        name: Load accepted workflow stack
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const stack = JSON.parse(fs.readFileSync("asset-tooling/stability/workflow-stack.json", "utf8"));
          console.log(`editor_repository=${stack.editor.repository}`);
          console.log(`editor_commit=${stack.editor.commit}`);
          console.log(`runner_repository=${stack.runner.repository}`);
          console.log(`runner_commit=${stack.runner.commit}`);
          NODE
      - name: Checkout accepted workflow-editor
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ steps.stack.outputs.editor_repository }}
          ref: ${{ steps.stack.outputs.editor_commit }}
          path: workflow-editor
          persist-credentials: false
      - name: Checkout accepted workflow-runner
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ steps.stack.outputs.runner_repository }}
          ref: ${{ steps.stack.outputs.runner_commit }}
          path: workflow-runner
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install workflow-editor dependencies from lockfile
        working-directory: workflow-editor
        run: bun install --frozen-lockfile
      - name: Validate descriptor/editor/runner bridge
        shell: bash
        run: |
          bun asset-tooling/scripts/check-workflow-bridge.js \
            "$GITHUB_WORKSPACE/workflow-editor" \
            "$GITHUB_WORKSPACE/workflow-runner" \
            "${{ steps.stack.outputs.editor_commit }}" \
            "${{ steps.stack.outputs.runner_commit }}"
