name: Catalog Pages

on:
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "src/catalog-pages.ts"
      - "src/catalog-pages-site.ts"
      - "scripts/build-catalog-pages.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: asset-tooling-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without LFS hydration
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Validate catalog provenance
        run: |
          bun run catalog:check
          bun run catalog:storage:check

      - name: Build deterministic catalog site
        run: |
          bun run pages:build
          test -s dist/pages/index.html
          test -s dist/pages/catalog.json
          test "$(find dist/pages/assets -name index.html -type f | wc -l)" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
