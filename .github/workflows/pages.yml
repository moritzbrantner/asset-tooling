name: Catalog Pages

on:
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "src/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/**"
      - "review/**"
      - "adapters/blender/**"
      - "examples/reconcile-file.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "src/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/**"
      - "review/**"
      - "adapters/blender/**"
      - "examples/reconcile-file.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-tooling-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without LFS hydration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false

      # The review namespace (#211) and the Ranger comparison's humanoid members (#111) are hydrated;
      # every other canonical payload stays an LFS pointer.
      - name: Hydrate review candidates and the Ranger comparison sources
        run: git lfs pull --include="review/**,assets/canonical/quaternius.universal-base-characters-standard.*/**,assets/canonical/quaternius.modular-character-outfits-fantasy-standard.*/**,assets/canonical/quaternius.universal-animation-library-standard.*/**,assets/canonical/quaternius.universal-animation-library-2-standard.*/**"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Install recipe runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bun install --frozen-lockfile

      - name: Install pinned Blender
        run: echo "ASSET_TOOLING_BLENDER=$(bun scripts/install-blender.ts "$RUNNER_TEMP/blender")" >> "$GITHUB_ENV"

      - name: Acquire pinned Sapling recipe input
        run: |
          set -euo pipefail
          SAPLING_SOURCE_URL=$(bun -e 'import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; console.log(SAPLING_TREE_SOURCE.download)')
          curl --fail --location --max-time 30 --max-filesize 36296 "$SAPLING_SOURCE_URL" --output "$RUNNER_TEMP/sapling.zip"
          bun -e 'import { readFile } from "node:fs/promises"; import { sha256Bytes } from "./src/hash.ts"; import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; const bytes = await readFile(process.argv[1]); if (bytes.length !== SAPLING_TREE_SOURCE.byteLength || sha256Bytes(bytes) !== SAPLING_TREE_SOURCE.sha256) throw new Error("Sapling input pin mismatch")' "$RUNNER_TEMP/sapling.zip"
          echo "ASSET_TOOLING_SAPLING_ARCHIVE=$RUNNER_TEMP/sapling.zip" >> "$GITHUB_ENV"

      # Build the public review against the latest published Ranger output; no hand-maintained tar hash.
      - name: Download current Ranger output for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' | grep -E '^humanoid-ranger-male-v[0-9]+

      - name: Validate catalog provenance
        run: |
          bun run catalog:check
          bun run catalog:storage:check

      - name: Build real previews from accepted recipes
        run: bun run pages:previews

      - name: Build deterministic catalog site
        run: |
          bun run pages:build
          test -s dist/pages/index.html
          test -s dist/pages/catalog.json
          test -s dist/pages/previews/index.json
          test -s dist/pages/previews/rock.rounded.glb
          test -s dist/pages/previews/wheat.mature.glb
          test -s dist/pages/previews/surface.soil-fine.png
          test -s dist/pages/previews/feedback.farm.harvest-pop.strong.wav
          test -s dist/pages/generate/index.html
          test -s dist/pages/generate/app.js
          test -s dist/pages/compare/ranger/data.json
          test -s dist/pages/compare/ranger/app.js
          test -s dist/pages/review/warden-icons/index.html
          test -s dist/pages/review/warden-icons/images/approved/warden.ability.4.32.png
          test "$(find dist/pages/assets -name index.html -type f | wc -l)" -gt 0

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
 | sort -V | tail -n 1)
          test -n "$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern humanoid.ranger.male.tar --dir "$RUNNER_TEMP/ranger"
          echo "ASSET_TOOLING_RANGER_BUNDLE_TAR=$RUNNER_TEMP/ranger/humanoid.ranger.male.tar" >> "$GITHUB_ENV"
          echo "ASSET_TOOLING_RANGER_BUNDLE_LABEL=$TAG" >> "$GITHUB_ENV"
          echo "ASSET_TOOLING_REQUIRE_RANGER_COMPARISON=1" >> "$GITHUB_ENV"

      - name: Validate catalog provenance
        run: |
          bun run catalog:check
          bun run catalog:storage:check

      - name: Build real previews from accepted recipes
        run: bun run pages:previews

      - name: Build deterministic catalog site
        run: |
          bun run pages:build
          test -s dist/pages/index.html
          test -s dist/pages/catalog.json
          test -s dist/pages/previews/index.json
          test -s dist/pages/previews/rock.rounded.glb
          test -s dist/pages/previews/wheat.mature.glb
          test -s dist/pages/previews/surface.soil-fine.png
          test -s dist/pages/previews/feedback.farm.harvest-pop.strong.wav
          test -s dist/pages/generate/index.html
          test -s dist/pages/generate/app.js
          test -s dist/pages/compare/ranger/data.json
          test -s dist/pages/compare/ranger/app.js
          test -s dist/pages/review/warden-icons/index.html
          test -s dist/pages/review/warden-icons/images/approved/warden.ability.4.32.png
          test "$(find dist/pages/assets -name index.html -type f | wc -l)" -gt 0

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
