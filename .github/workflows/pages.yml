name: Catalog Pages

on:
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "src/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/**"
      - "review/**"
      - "adapters/blender/**"
      - "examples/reconcile-file.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_call:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-tooling-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without LFS hydration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A release event points at a tag; always publish the current main site, not an older tagged checkout.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          lfs: false
          persist-credentials: false

      # The review namespace (#211) and the Ranger comparison's humanoid members (#111) are hydrated;
      # every other canonical payload stays an LFS pointer.
      - name: Hydrate review candidates and the Ranger comparison sources
        run: git lfs pull --include="review/**,assets/canonical/quaternius.universal-base-characters-standard.*/**,assets/canonical/quaternius.modular-character-outfits-fantasy-standard.*/**,assets/canonical/quaternius.universal-animation-library-standard.*/**,assets/canonical/quaternius.universal-animation-library-2-standard.*/**"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install latest stable FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEC_BIN="$(bun scripts/install-ffmpeg.ts)"
          echo "$CODEC_BIN" >> "$GITHUB_PATH"

      - name: Install recipe dependencies
        run: bun install --frozen-lockfile

      # This job already hydrates review/**; exercise the exact approval-byte
      # contract against the current stable codec without another download/job.
      - name: Replay approved Warden derivatives with stable FFmpeg
        if: github.event_name == 'pull_request'
        run: bun scripts/export-warden-icons.ts --check

      - name: Install pinned Blender
        run: echo "ASSET_TOOLING_BLENDER=$(bun scripts/install-blender.ts "$RUNNER_TEMP/blender")" >> "$GITHUB_ENV"

      - name: Acquire pinned Sapling recipe input
        run: |
          set -euo pipefail
          SAPLING_SOURCE_URL=$(bun -e 'import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; console.log(SAPLING_TREE_SOURCE.download)')
          curl --fail --location --max-time 30 --max-filesize 36296 "$SAPLING_SOURCE_URL" --output "$RUNNER_TEMP/sapling.zip"
          bun -e 'import { readFile } from "node:fs/promises"; import { sha256Bytes } from "./src/hash.ts"; import { SAPLING_TREE_SOURCE } from "./src/tree-recipes.ts"; const bytes = await readFile(process.argv[1]); if (bytes.length !== SAPLING_TREE_SOURCE.byteLength || sha256Bytes(bytes) !== SAPLING_TREE_SOURCE.sha256) throw new Error("Sapling input pin mismatch")' "$RUNNER_TEMP/sapling.zip"
          echo "ASSET_TOOLING_SAPLING_ARCHIVE=$RUNNER_TEMP/sapling.zip" >> "$GITHUB_ENV"

      # Build the public review against the rolling Ranger release; no hand-maintained tar hash or version.
      - name: Download current Ranger output for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling release per experimental bundle (Decision 7.1.5); its assets are replaced in place.
          TAG=humanoid-ranger-male
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern humanoid.ranger.male.tar --dir "$RUNNER_TEMP/ranger"
          echo "ASSET_TOOLING_RANGER_BUNDLE_TAR=$RUNNER_TEMP/ranger/humanoid.ranger.male.tar" >> "$GITHUB_ENV"
          SHA=$(sha256sum "$RUNNER_TEMP/ranger/humanoid.ranger.male.tar" | cut -c1-12)
          echo "ASSET_TOOLING_RANGER_BUNDLE_LABEL=$TAG (tar $SHA)" >> "$GITHUB_ENV"
          echo "ASSET_TOOLING_REQUIRE_RANGER_COMPARISON=1" >> "$GITHUB_ENV"
          # #517: the male figure wears the hair kit's hairstyles; the comparison offers them from its rolling release.
          gh release download hair-kit --repo "$GITHUB_REPOSITORY" --pattern hair.kit.tar --dir "$RUNNER_TEMP/hair"
          echo "ASSET_TOOLING_HAIR_KIT_TAR=$RUNNER_TEMP/hair/hair.kit.tar" >> "$GITHUB_ENV"
          echo "ASSET_TOOLING_HAIR_KIT_LABEL=hair-kit (tar $(sha256sum "$RUNNER_TEMP/hair/hair.kit.tar" | cut -c1-12))" >> "$GITHUB_ENV"

      # The slider page shows a notice until the first young-residents release exists.
      - name: Download current young residents output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download young-residents --repo "$GITHUB_REPOSITORY" --pattern young-residents.kit.tar --dir "$RUNNER_TEMP/young"; then
            echo "ASSET_TOOLING_YOUNG_BUNDLE_TAR=$RUNNER_TEMP/young/young-residents.kit.tar" >> "$GITHUB_ENV"
          fi

      - name: Validate catalog provenance
        run: |
          bun run catalog:check
          bun run catalog:storage:check

      - name: Build real previews from accepted recipes
        run: bun run pages:previews

      - name: Build deterministic catalog site
        run: |
          bun run pages:build
          test -s dist/pages/index.html
          test -s dist/pages/catalog.json
          test -s dist/pages/previews/index.json
          test -s dist/pages/previews/rock.rounded.glb
          test -s dist/pages/previews/wheat.mature.glb
          test -s dist/pages/previews/surface.soil-fine.png
          test -s dist/pages/previews/feedback.farm.harvest-pop.strong.wav
          test -s dist/pages/generate/index.html
          test -s dist/pages/generate/app.js
          test -s dist/pages/compare/ranger/data.json
          test -s dist/pages/compare/ranger/app.js
          test -s dist/pages/review/warden-icons/index.html
          test -s dist/pages/review/warden-icons/images/approved/warden.ability.4.32.png
          test "$(find dist/pages/assets -name index.html -type f | wc -l)" -gt 0

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
