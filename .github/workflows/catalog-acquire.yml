name: Catalog acquisition evidence

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Registered shared catalog source id to acquire and pin
        required: true
        type: string

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_ID: ${{ inputs.source_id }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Acquire registered source and compute pin evidence
        run: bun scripts/acquire-catalog-source.js "$SOURCE_ID" .artifacts/catalog-acquisition
      - name: Upload acquired bytes and pin evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-pin-${{ github.run_id }}
          path: .artifacts/catalog-acquisition/
          if-no-files-found: error
          retention-days: 7
